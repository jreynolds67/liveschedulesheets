# ---------------------------------------------------------------------------
# LiveScheduleSheets configuration
# Seeds /data/config.yaml on first run; normally edited from the web UI.
# The LSP login set in the UI is stored in the live config.yaml (on the /data
# volume); LSP_USERNAME / LSP_PASSWORD env vars are used when it isn't set.
# The Google key is uploaded in the UI or mounted (GOOGLE_APPLICATION_CREDENTIALS).
# ---------------------------------------------------------------------------

sheet:
  # The sheet's link, or just its ID (the part after /d/):
  #   https://docs.google.com/spreadsheets/d/<THIS PART>/edit
  # Normally set by pasting the link in the web UI (stored as the bare ID).
  spreadsheet_id: "1TNVdUIEy1TNRAzBVEWmRnzxO-vwV3AzbYwDzm6GGOSQ"

  # Which worksheet tabs to read. Each tab is one sport (Football, Fall
  # Olympic, ...) in the same transposed layout: row headers down
  # `header_column`, one event per column.
  #
  # LEAVE EMPTY to auto-discover every VISIBLE tab -- hidden tabs (e.g. COUNT
  # and the old *RELAYOUT composites) are always skipped. Or list specific
  # tabs as an allow-list (still intersected with the visible tabs).
  tabs: []
    # - "Football"
    # - "Fall Olympic"

  # Column holding the row-header labels (the left-hand labels). Usually "A".
  header_column: "A"

  # For each field, a list of accepted row-header labels (case-insensitive,
  # surrounding spaces ignored). The FIRST matching row wins -- important for
  # `pcr`, where a tab may repeat CONTROL ROOM for a secondary block we ignore.
  # If no label matches, a header keyword (KICKOFF, Ctrl Room, ...) and then
  # the row's contents (dates / A-E letters only) are tried; per-tab picks in
  # tab_overrides.<tab>.rows beat all of this.
  #
  #   event_name, date and time are required; DATE and the start time are
  #   always separate rows. The channel comes from the `pcr` (PCR / CONTROL
  #   ROOM) row, whose cells hold "A" or "PCR A".
  labels:
    event_name: ["EVENT"]
    pcr: ["CONTROL ROOM", "PCR"]
    date: ["DATE"]
    time: ["GAME START", "GAME TIME", "START TIME"]

  # IANA timezone the sheet's times are written in.
  timezone: "America/New_York"

date_parsing:
  # Dates must include the year (e.g. 9/12/2026); an event whose date has no
  # year is skipped and flagged in the UI.
  # Values (case-insensitive) that mean "no time yet" -> the column is skipped.
  skip_values: ["TBD", "TBA", "N/A", "-", "OFF"]

scheduling:
  # Begin recording this many minutes BEFORE the sheet's start time (0-1440).
  # Changing this (or the caps below) also updates events already in LSP that
  # haven't started, unless they were changed by hand there (locked).
  lead_in_minutes: 10
  # LSP requires an End. An engineer normally stops recording manually; if not,
  # the event auto-stops this many hours after it starts (up to 48).
  safety_cap_hours: 6
  # Per-sport caps that replace safety_cap_hours. A sport applies when its code
  # appears in the event name as a whole word, ignoring case ("WSOC" matches
  # "WSOC vs Texas", not "XWSOC"). The first matching entry wins.
  sport_safety_caps: []
    # - { sport: "WSOC", hours: 3 }
    # - { sport: "VB", hours: 3.5 }
  # Only create events whose padded start is within this many days ahead
  # (1-366). A tracked event the sheet moves outside this window (or into the
  # past) is left as it is in LSP and flagged in Preview: usually a typo.
  horizon_days: 60
  # Skip events whose start is more than this many minutes in the past.
  past_grace_minutes: 30
  # Optional prefix for the LSP event name, e.g. "AUTO " -> "AUTO FB vs UCF".
  event_name_prefix: ""

# PCR letter (from the sheet) -> Live Schedule Pro channels.
# Each event is booked on EVERY channel whose name contains channel_match as a
# whole word, ignoring case -- "PCR A" matches "01 - PCR A PGM (x264)" and
# "02 - PCR A CLEAN (ProRes422)" but not "PCR AB". Channels are looked up live
# each pass. Optionally add channel_id (a UUID) to also include one specific
# channel. A letter omitted here is logged and skipped.
pcr_channel_map:
  A: { channel_match: "PCR A" }
  B: { channel_match: "PCR B" }
  C: { channel_match: "PCR C" }
  D: { channel_match: "PCR D" }
  E: { channel_match: "PCR E" }

# Per-tab overrides (normally managed from the web UI).
#   enabled: false to skip a whole tab.
#   rows:    pin which row feeds a field when auto-detection is wrong (set
#            from the UI's row-mapping preview). Fields: event_name, date,
#            time, pcr. Each is {row: <1-based row>, label: <its column-A
#            text>} -- the label lets the pick follow the row if rows are
#            inserted above it -- or {none: true} for "no such row".
tab_overrides: {}
  # Football:
  #   enabled: false
  # "Special Events":
  #   rows:
  #     time: { row: 4, label: "START TIME" }

# Per-event fixes for missing/wrong data (normally managed from the web UI).
# Matched by date + event name (+ occurrence when a tab has duplicates on the
# same day, 0-based). Any field you omit is left as parsed.
#   control_room: assign/override the PCR letter.
#   start:        override the start ("YYYY-MM-DD HH:MM", sheet timezone).
#   ignore:       true to drop this event entirely.
event_overrides: {}
  # "Fall Olympic":
  #   - date: "2026-08-27"
  #     event: "Opening Spike VB (SET DAY)"
  #     occurrence: 0
  #     control_room: "A"

lsp:
  base_url: "https://live-schedule-pro.example.com"   # no trailing slash
  verify_ssl: true                                     # false only for self-signed certs
  # The Vantage workflow variable on each event that gets the event name from
  # the sheet (e.g. "VB STANFORD PITT") instead of its default (e.g. "Event
  # XX"). Matched by name, ignoring case. The tool sets it on every event it
  # creates or updates. Blank = off.
  event_name_variable: "Event Name"
  # username / password are normally set in the UI. The password is only sent
  # to the base_url it was entered for (recorded as password_for); changing
  # base_url without re-entering it clears it.

runtime:
  poll_interval_seconds: 900   # 15 minutes (60 or more)
  live: false                  # false = DRY RUN: syncs log what would be created and change
                               # nothing in LSP (Preview's per-event "Send to LSP" and the
                               # cleanup button still act). Set only by the UI's Dry run
                               # switch; the UI's Save leaves it as it is.
  state_file: "/data/state.json"   # tracked events + lock state; mount a volume so it
                                   # survives restarts. Log level: LOG_LEVEL env var.
