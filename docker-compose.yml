# Deploy this stack in Portainer (Stacks -> Add stack).
# Set secrets as stack environment variables. Most configuration is done in the
# web UI (http://10.10.251.95) and stored on the lss_state volume.
services:
  liveschedulesheets:
    build: .
    # Or, if you push the image to a registry:
    # image: your-registry/liveschedulesheets:latest
    container_name: liveschedulesheets
    restart: unless-stopped
    environment:
      TZ: America/New_York
      # Serve the UI on port 80 so the URL needs no port.
      WEB_PORT: "80"
      # Optional: seed the LSP login here, or set it in the web UI instead.
      LSP_USERNAME: ${LSP_USERNAME:-}
      LSP_PASSWORD: ${LSP_PASSWORD:-}
      # Google service-account key path INSIDE the container (see volume below).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      # Optional HTTP Basic auth for the UI (leave unset to disable).
      UI_USER: ${UI_USER:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Dry run: nothing is created in (or deleted from) LSP. Overrides the UI
      # toggle while set. To go live, set DRY_RUN=false on the stack and redeploy.
      DRY_RUN: ${DRY_RUN:-true}
    sysctls:
      # Let the non-root app user bind port 80.
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      # Joins the existing Companion ipvlan network (only one ipvlan network
      # can use eth0). The web UI is on port 80 at this IP.
      companion_net:
        ipv4_address: 10.10.251.95
    volumes:
      # Folder ON THE DOCKER HOST holding service-account.json (read-only).
      # Absolute path, because Portainer Git stacks can't see files next to the
      # compose file. The key can be added later without redeploying.
      - ${GOOGLE_KEY_DIR:-/opt/liveschedulesheets}:/secrets:ro
      # Persistent config (config.yaml) + de-dup state (state.json).
      - lss_state:/data

networks:
  companion_net:
    # Created by the Companion stack (ipvlan, parent eth0, 10.10.251.0/24).
    # Set COMPANION_NETWORK to its full Docker name if it differs.
    external: true
    name: ${COMPANION_NETWORK:-companion_companion_net}

volumes:
  lss_state: {}
